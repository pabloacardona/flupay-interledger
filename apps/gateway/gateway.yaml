# Gateway configuration. Secrets (the FluPay API key) live in .env, never here.

# Backend the gateway protects. It knows nothing about payments.
upstream: http://localhost:3000

# Per-route pricing. Patterns are exact paths or prefixes ending in /*.
# First matching pattern wins, so list the most specific routes first.
# Prices use the currency of the merchant wallet linked to the FluPay API key.
routes:
  - path: /api/premium/*
    price: 200 COP
  - path: /api/*
    price: 50 COP
  - path: /*
    price: free
